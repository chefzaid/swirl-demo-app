services:
  swirl-demo-app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace/swirl-demo-app:cached
      - swirl-demo-app-node-modules:/workspace/swirl-demo-app/swirlapp-web/node_modules
      - swirl-demo-app-maven-cache:/home/vscode/.m2
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-devdb}
      DB_USERNAME: ${DB_USERNAME:-devuser}
      DB_PASSWORD: ${DB_PASSWORD:-devpass}
      NODE_ENV: development
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://keycloak:8080/auth/realms/swirl-demo-app}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-http://keycloak:8080/auth/realms/swirl-demo-app/protocol/openid-connect/certs}
    ports:
      - "4200:4200"
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
    command: sleep infinity

  kafka:
    image: apache/kafka:4.3.1
    profiles: ["local-infra"]
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data

  redis:
    image: redis:8.8-alpine
    profiles: ["local-infra"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:18.4-alpine
    profiles: ["local-infra"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-devdb}
      POSTGRES_USER: ${DB_USERNAME:-devuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpass}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    profiles: ["local-infra"]
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost:8180/auth
    volumes:
      - ../infra/keycloak/swirl-demo-app-realm.json:/opt/keycloak/data/import/swirl-demo-app-realm.json:ro
    ports:
      - "8180:8080"
    depends_on:
      - postgres

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  swirl-demo-app-node-modules:
  swirl-demo-app-maven-cache:
