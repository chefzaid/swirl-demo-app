workflow:
  name: "$CI_PROJECT_NAME: $PIPELINE_MODE pipeline"
  rules:
    - if: '$SONAR_SCAN_ONLY == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $APP_ONBOARDING == "true"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - build
  - verify
  - release
  - version

default:
  tags:
    - swirl-cloud-application-int
  interruptible: true

variables:
  GIT_DEPTH: "0"
  SONAR_SCAN_ONLY: "false"
  APP_ONBOARDING: "false"
  DEPLOYMENT_ENVIRONMENT:
    value: "int"
    options: ["int", "uat", "prod"]
    description: "Application environment managed by Argo CD, on the shared cluster or a remote cluster. Only this environment is deployed."
  RELEASE_VERSION:
    value: ""
    description: "Existing finalized release to promote (for example 1.2.3). Empty builds a branch snapshot for int, or a default-branch release for uat/prod."
  PIPELINE_MODE:
    value: "standard"
    options:
      - "standard"
      - "full"
    description: "Full builds and deploys the selected branch to int, or publishes/promotes a release to uat/prod. E2E remains optional."
  COVERAGE_MINIMUM: "85"
  NEW_MAJOR_VERSION:
    value: ""
    description: "Major version number for the manual set-major-version job (for example: 2)."
  REGISTRY_PUSH_HOST: "gitlab-registry.swirlit.internal:5050"
  PACKAGE_REGISTRY_API_V4_URL: "http://gitlab.swirlit.internal/api/v4"
  SONAR_HOST_URL: "http://sonarqube.infra.svc.cluster.local:9000"
  SONAR_USER_HOME: "$CI_PROJECT_DIR/.cache/sonar"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.cache/maven"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  KANIKO_IMAGE: "gcr.io/kaniko-project/executor@sha256:c3109d5926a997b100c4343944e06c6b30a6804b2f9abe0994d3de6ef92b028e"
  KANIKO_EXECUTOR: "$CI_PROJECT_DIR/.cache/kaniko/executor"

00-delivery-policy:
  stage: .pre
  image: docker.io/library/maven@sha256:8df9a1dbc464977482f726f28a8a1985dcef4e4e68bdda1ae0330711bcb3a192
  before_script:
    - apk add --no-cache bash
  script:
    - infra/scripts/ci-release.sh validate

01-build:
  stage: build
  image: docker.io/library/maven@sha256:8df9a1dbc464977482f726f28a8a1985dcef4e4e68bdda1ae0330711bcb3a192
  cache:
    - key: swirl-demo-app-maven-v2
      paths:
        - .cache/maven/
      policy: pull-push
    - key: swirl-demo-app-npm-v2
      paths:
        - .cache/npm/
      policy: pull-push
  before_script:
    - apk add --no-cache bash git jq kubectl nodejs npm prometheus python3 py3-yaml
    - export APP_VERSION="$(infra/scripts/current-version.sh)"
  script:
    - infra/scripts/ci-verify.sh build
  artifacts:
    name: "swirl-demo-app-compiled-$CI_COMMIT_SHORT_SHA"
    expire_in: 7 days
    paths:
      - swirlapp-user/target/swirlapp-user.jar
      - swirlapp-order/target/swirlapp-order.jar
      - swirlapp-web/dist/
      - swirlapp-web/swirlapp-web-*.tar.gz
  rules:
    - if: '$RELEASE_VERSION != ""'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

02-test:
  stage: build
  needs:
    - job: 01-build
      artifacts: false
  image: docker.io/library/maven@sha256:8df9a1dbc464977482f726f28a8a1985dcef4e4e68bdda1ae0330711bcb3a192
  cache:
    - key: swirl-demo-app-maven-v2
      paths:
        - .cache/maven/
      policy: pull-push
    - key: swirl-demo-app-npm-v2
      paths:
        - .cache/npm/
      policy: pull-push
  before_script:
    - apk add --no-cache bash chromium git nodejs npm python3
    - export APP_VERSION="$(infra/scripts/current-version.sh)"
  script:
    - infra/scripts/ci-verify.sh test
  coverage: '/TOTAL_COVERAGE=([0-9]+(?:\.[0-9]+)?)%/'
  allow_failure: true
  artifacts:
    name: "swirl-demo-app-tests-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 7 days
    reports:
      junit:
        - '**/target/surefire-reports/*.xml'
        - swirlapp-web/test-results.xml
        - coverage-policy-junit.xml
      coverage_report:
        coverage_format: cobertura
        path: swirlapp-web/coverage/swirlapp-web/cobertura-coverage.xml
      dotenv: coverage-policy.env
    paths:
      - swirlapp-web/coverage/
      - swirlapp-web/test-results.xml
      - '**/target/site/jacoco/'
      - '**/target/surefire-reports/'
      - '**/target/classes/'
      - coverage-policy-junit.xml
      - coverage-policy.env
  rules:
    - if: '$RELEASE_VERSION != ""'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

01-e2e:
  stage: verify
  needs:
    - job: 01-build
      artifacts: true
  image:
    name: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    entrypoint: [""]
  cache:
    - key: swirl-demo-app-playwright-npm-v2
      paths:
        - .cache/npm/
      policy: pull-push
  before_script:
    - cd swirlapp-web
    - npm ci
  script:
    - npm run test:e2e
  artifacts:
    name: "swirl-demo-app-e2e-$CI_COMMIT_SHORT_SHA"
    expose_as: "Playwright E2E report"
    when: always
    expire_in: 7 days
    reports:
      junit: swirlapp-web/test-results/playwright-junit.xml
    paths:
      - swirlapp-web/test-results/
      - swirlapp-web/playwright-report/
  manual_confirmation: "Run the optional Playwright E2E tests for $CI_COMMIT_SHORT_SHA?"
  rules:
    - if: '$RELEASE_VERSION != ""'
      when: never
    - if: '$SONAR_SCAN_ONLY == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true

02-quality:
  stage: verify
  needs:
    - job: 02-test
      artifacts: true
  image:
    name: node:24.15.0-bookworm-slim@sha256:4e6b70dd6cbfc88c8157ba19aa3d9f9cce6ba4703576d55459e45efcbc9c5f5d
    entrypoint: [""]
  cache:
    - key: swirl-demo-app-maven-v2
      paths:
        - .cache/maven/
      policy: pull
    - key: swirl-demo-app-sonar-v1
      paths:
        - .cache/sonar/cache/
      policy: pull-push
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git ca-certificates
    - export APP_VERSION="$("$CI_PROJECT_DIR/infra/scripts/current-version.sh")"
    - npm install --global @sonar/scan@5.0.0
  script:
    - bash infra/scripts/test-quality.sh
    - bash infra/scripts/ci-quality.sh
  allow_failure: true
  artifacts:
    name: "swirl-demo-app-quality-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 7 days
    reports:
      dotenv: quality-reports/quality.env
    paths:
      - quality-reports/
  rules:
    - if: '$RELEASE_VERSION != ""'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$PIPELINE_MODE == "full" && $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$PIPELINE_MODE == "full" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true

03-security:
  stage: verify
  image:
    name: docker.io/aquasec/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: .cache/trivy
    TRIVY_DISABLE_TELEMETRY: "true"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_TIMEOUT: 10m
  cache:
    - key: swirl-demo-app-trivy-v1
      paths:
        - .cache/trivy/
      policy: pull-push
  script:
    - mkdir -p security-reports
    - trivy fs --offline-scan --include-dev-deps --scanners vuln,misconfig,secret --skip-dirs '**/.git' --skip-dirs '**/.cache' --skip-dirs '**/node_modules' --skip-dirs '**/target' --skip-dirs '**/dist' --skip-dirs '**/coverage' --format json --output security-reports/trivy.json .
    - trivy convert --scanners vuln,misconfig,secret --format sarif --output security-reports/trivy.sarif security-reports/trivy.json
    # Inventory every Maven and npm dependency, including build-time ones, before the gate can stop the job.
    - trivy fs --offline-scan --include-dev-deps --format cyclonedx --skip-dirs '**/.git' --skip-dirs '**/.cache' --skip-dirs '**/node_modules' --skip-dirs '**/target' --skip-dirs '**/dist' --skip-dirs '**/coverage' --output security-reports/sbom.cdx.json .
    - trivy convert --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --format table --exit-code 1 security-reports/trivy.json
  allow_failure: true
  artifacts:
    name: "swirl-demo-app-security-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 7 days
    reports:
      cyclonedx:
        - security-reports/sbom.cdx.json
    paths:
      - security-reports/
  rules:
    - if: '$RELEASE_VERSION != ""'
      when: never
    - if: '$SONAR_SCAN_ONLY == "true"'
      when: never
    - if: '$PIPELINE_MODE == "full" && $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$PIPELINE_MODE == "full" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true

01-release:
  stage: release
  tags: [swirl-cloud-application-release]
  needs:
    - job: 01-build
      artifacts: true
  image:
    name: docker.io/library/maven@sha256:8df9a1dbc464977482f726f28a8a1985dcef4e4e68bdda1ae0330711bcb3a192
    entrypoint: [""]
  cache:
    - key: swirl-demo-app-kaniko-executor-v1
      paths:
        - .cache/kaniko/
      policy: pull-push
  resource_group: swirl-demo-app-release
  interruptible: false
  before_script:
    - apk add --no-cache bash crane curl git jq
    - export APP_VERSION="$(infra/scripts/current-version.sh)"
    - mkdir -p .cache/kaniko /kaniko/ssl/certs
    - test -s "$KANIKO_EXECUTOR" || crane export "$KANIKO_IMAGE" | tar -xOf - kaniko/executor > "$KANIKO_EXECUTOR"
    - chmod 0755 "$KANIKO_EXECUTOR"
    - cp /etc/ssl/certs/ca-certificates.crt /kaniko/ssl/certs/ca-certificates.crt
  script:
    - infra/scripts/ci-release.sh publish
  artifacts:
    name: "swirl-demo-app-release-$CI_COMMIT_SHORT_SHA"
    expose_as: "Release packages and checksums"
    when: always
    expire_in: 7 days
    reports:
      dotenv: release.env
    paths:
      - package-output/
      - release.env
  manual_confirmation: "Release the successful Swirl Demo App build for $CI_COMMIT_SHORT_SHA?"
  rules:
    - if: '$RELEASE_VERSION != ""'
      when: never
    - if: '$SONAR_SCAN_ONLY == "true"'
      when: never
    - if: '$NEW_MAJOR_VERSION != ""'
      when: never
    - if: '$DEPLOYMENT_ENVIRONMENT == "prod"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $APP_ONBOARDING == "true"'
    - if: '$DEPLOYMENT_ENVIRONMENT == "int"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PIPELINE_MODE == "full"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false

01-snapshot:
  stage: release
  needs:
    - job: 01-build
      artifacts: true
  image:
    name: docker.io/library/maven@sha256:8df9a1dbc464977482f726f28a8a1985dcef4e4e68bdda1ae0330711bcb3a192
    entrypoint: [""]
  cache:
    - key: swirl-demo-app-kaniko-executor-v1
      paths:
        - .cache/kaniko/
      policy: pull-push
  resource_group: swirl-demo-app-snapshot-$CI_PIPELINE_ID
  interruptible: false
  before_script:
    - apk add --no-cache bash crane curl git jq
    - mkdir -p .cache/kaniko /kaniko/ssl/certs
    - test -s "$KANIKO_EXECUTOR" || crane export "$KANIKO_IMAGE" | tar -xOf - kaniko/executor > "$KANIKO_EXECUTOR"
    - chmod 0755 "$KANIKO_EXECUTOR"
    - cp /etc/ssl/certs/ca-certificates.crt /kaniko/ssl/certs/ca-certificates.crt
  script:
    - infra/scripts/ci-release.sh snapshot
  artifacts:
    name: "swirl-demo-app-snapshot-$CI_COMMIT_SHORT_SHA"
    expose_as: "Immutable integration snapshot"
    when: always
    expire_in: 7 days
    reports:
      dotenv: release.env
    paths:
      - package-output/
      - release.env
  rules:
    - if: '$RELEASE_VERSION != "" || $SONAR_SCAN_ONLY == "true" || $APP_ONBOARDING == "true" || $DEPLOYMENT_ENVIRONMENT != "int" || $NEW_MAJOR_VERSION != ""'
      when: never
    - if: '$CI_COMMIT_BRANCH'

02-deploy:
  stage: release
  tags: ["swirl-cloud-application-$DEPLOYMENT_ENVIRONMENT"]
  needs:
    - job: 00-delivery-policy
      artifacts: false
    - job: 01-snapshot
      artifacts: true
      optional: true
    - job: 01-release
      artifacts: true
      optional: true
  image:
    name: docker.io/library/maven@sha256:8df9a1dbc464977482f726f28a8a1985dcef4e4e68bdda1ae0330711bcb3a192
    entrypoint: [""]
  resource_group: swirl-demo-app-$DEPLOYMENT_ENVIRONMENT
  interruptible: false
  before_script:
    - apk add --no-cache bash curl git jq python3 py3-yaml
    - curl --fail --silent --show-error --location --output /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.35.4/bin/linux/amd64/kubectl"
    - echo "b529430df69a688fd61b64ad2299edb5fd71cb58be2a4779dba624c7d3510efd  /usr/local/bin/kubectl" | sha256sum -c
    - chmod 0755 /usr/local/bin/kubectl
  script:
    - infra/scripts/ci-release.sh deploy
  environment:
    name: $DEPLOYMENT_ENVIRONMENT
    url: $DEPLOYMENT_URL
    deployment_tier: $DEPLOYMENT_TIER
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      dotenv: release.env
    paths:
      - release.env
      - package-output/deployment.json
  rules:
    - if: '$SONAR_SCAN_ONLY == "true"'
      when: never
    - if: '$NEW_MAJOR_VERSION != ""'
      when: never
    - if: '$CI_COMMIT_BRANCH && $DEPLOYMENT_ENVIRONMENT == "int"'
      variables:
        DEPLOYMENT_TIER: testing
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOYMENT_ENVIRONMENT == "uat"'
      variables:
        DEPLOYMENT_TIER: staging
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOYMENT_ENVIRONMENT == "prod"'
      variables:
        DEPLOYMENT_TIER: production

# Default-branch commits offer one manual publication; the release then deploys
# to uat automatically. prod promotes that uat release from a web pipeline.
01-publish:
  extends: 01-release
  manual_confirmation: "Publish $CI_COMMIT_SHORT_SHA as a release and deploy it to uat?"
  rules:
    - if: '$CI_PIPELINE_SOURCE != "push" || $RELEASE_VERSION != "" || $SONAR_SCAN_ONLY == "true" || $NEW_MAJOR_VERSION != ""'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

02-deploy-uat:
  extends: 02-deploy
  tags: [swirl-cloud-application-uat]
  needs:
    - job: 00-delivery-policy
      artifacts: false
    - job: 01-publish
      artifacts: true
  resource_group: swirl-demo-app-uat
  variables:
    DEPLOYMENT_ENVIRONMENT: uat
    DEPLOYMENT_TIER: staging
  rules:
    - if: '$CI_PIPELINE_SOURCE != "push" || $RELEASE_VERSION != "" || $SONAR_SCAN_ONLY == "true" || $NEW_MAJOR_VERSION != ""'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

set-major-version:
  stage: version
  tags: [swirl-cloud-application-release]
  image:
    name: docker.io/library/maven@sha256:8df9a1dbc464977482f726f28a8a1985dcef4e4e68bdda1ae0330711bcb3a192
    entrypoint: [""]
  needs:
    - job: 00-delivery-policy
      artifacts: false
  resource_group: swirl-demo-app-release
  interruptible: false
  before_script:
    - apk add --no-cache bash git jq
  script:
    - infra/scripts/ci-set-major-version.sh
  manual_confirmation: "Set the next Swirl Demo App major version from NEW_MAJOR_VERSION?"
  rules:
    - if: '$RELEASE_VERSION != ""'
      when: never
    - if: '$SONAR_SCAN_ONLY == "true"'
      when: never
    - if: '$NEW_MAJOR_VERSION == ""'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
