workflow:
  name: "$CI_PROJECT_NAME: $PIPELINE_MODE pipeline"
  rules:
    - if: '$SONAR_SCAN_ONLY == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $APP_ONBOARDING == "true"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - build
  - verify
  - release
  - version

default:
  tags:
    - swirl-cloud-application-int
  interruptible: true

variables:
  GIT_DEPTH: "0"
  SONAR_SCAN_ONLY: "false"
  APP_ONBOARDING: "false"
  PLAYWRIGHT_SCHEDULE:
    value: "false"
    description: "true in the nightly schedule that builds, tests, packages and runs the Playwright E2E suite on its own (see docs/testing.md#scheduled-e2e-runs); no report, snapshot, release or deploy."
  DEPLOYMENT_ENVIRONMENT:
    value: "int"
    options: ["int", "uat", "prod"]
    description: "Application environment managed by Argo CD, on the shared cluster or a remote cluster. Only this environment is deployed."
  RELEASE_VERSION:
    value: ""
    description: "Existing finalized release to promote (for example 1.2.3). Empty builds a branch snapshot for int, or a default-branch release for uat/prod."
  PIPELINE_MODE:
    value: "standard"
    options:
      - "standard"
      - "full"
    description: "Full builds and deploys the selected branch to int, or publishes/promotes a release to uat/prod. E2E remains optional."
  COVERAGE_MINIMUM: "85"
  NEW_MAJOR_VERSION:
    value: ""
    description: "Major version number for the manual set-major-version job (for example: 2)."
  REGISTRY_PUSH_HOST: "gitlab-registry.swirl.internal:5050"
  PACKAGE_REGISTRY_API_V4_URL: "http://gitlab.swirl.internal/api/v4"
  SONAR_HOST_URL: "http://sonarqube.infra.svc.cluster.local:9000"
  SONAR_USER_HOME: "$CI_PROJECT_DIR/.cache/sonar"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.cache/maven"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  KANIKO_IMAGE: "gcr.io/kaniko-project/executor@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd"
  KANIKO_EXECUTOR: "$CI_PROJECT_DIR/.cache/kaniko/executor"

00-delivery-policy:
  stage: .pre
  image: docker.io/library/maven@sha256:a697e2f303fca5675052a656daefab51d845c79e6121a26edbdf8e3e4832ed97
  before_script:
    - apk add --no-cache bash
  script:
    - infra/scripts/ci-release.sh validate

# Server and web build in parallel; jobs that need 01-build wait for both.
01-build:
  stage: build
  parallel:
    matrix:
      - SUITE: [server, web]
  image: docker.io/library/maven@sha256:a697e2f303fca5675052a656daefab51d845c79e6121a26edbdf8e3e4832ed97
  cache:
    - key: swirl-demo-app-maven-v2
      paths:
        - .cache/maven/
      policy: pull-push
    - key: swirl-demo-app-npm-v2
      paths:
        - .cache/npm/
      policy: pull-push
  before_script:
    - apk add --no-cache bash git nodejs-current npm
    # The server suite also runs the repository checks (scripts, manifests, alert rules, docs).
    - if [ "$SUITE" = server ]; then apk add --no-cache jq kubectl prometheus python3 py3-yaml; fi
    - export APP_VERSION="$(infra/scripts/current-version.sh)"
  script:
    - infra/scripts/ci-verify.sh build "$SUITE"
  artifacts:
    name: "swirl-demo-app-compiled-$SUITE-$CI_COMMIT_SHORT_SHA"
    expire_in: 7 days
    paths:
      - swirlapp-user/target/swirlapp-user.jar
      - swirlapp-order/target/swirlapp-order.jar
      - swirlapp-web/dist/
      - swirlapp-web/swirlapp-web-*.tar.gz
  rules:
    - if: '$RELEASE_VERSION != ""'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# The Java modules and the SPA test in parallel, from the start of the pipeline;
# 04-coverage combines their coverage.
02-test:
  stage: build
  parallel:
    matrix:
      - SUITE: [server, web]
  needs:
    - job: 00-delivery-policy
      artifacts: false
  variables:
    KUBERNETES_CPU_LIMIT: "8"
    KUBERNETES_MEMORY_LIMIT: "12Gi"
  image: docker.io/library/maven@sha256:a697e2f303fca5675052a656daefab51d845c79e6121a26edbdf8e3e4832ed97
  cache:
    - key: swirl-demo-app-maven-v2
      paths:
        - .cache/maven/
      policy: pull-push
    - key: swirl-demo-app-npm-v2
      paths:
        - .cache/npm/
      policy: pull-push
  before_script:
    - apk add --no-cache bash git
    - if [ "$SUITE" = web ]; then apk add --no-cache nodejs-current npm; fi
    - export APP_VERSION="$(infra/scripts/current-version.sh)"
  script:
    - infra/scripts/ci-verify.sh test "$SUITE"
  allow_failure: true
  artifacts:
    name: "swirl-demo-app-tests-$SUITE-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 7 days
    reports:
      junit:
        - '**/target/surefire-reports/*.xml'
        - swirlapp-web/test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: swirlapp-web/coverage/swirlapp-web/cobertura-coverage.xml
    paths:
      - swirlapp-web/coverage/
      - swirlapp-web/test-results.xml
      - '**/target/site/jacoco/'
      - '**/target/surefire-reports/'
      - '**/target/classes/'
  rules:
    - if: '$RELEASE_VERSION != ""'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

03-package:
  stage: build
  needs:
    - job: 01-build
      artifacts: true
  image:
    name: docker.io/library/maven@sha256:a697e2f303fca5675052a656daefab51d845c79e6121a26edbdf8e3e4832ed97
    entrypoint: [""]
  cache:
    - key: swirl-demo-app-kaniko-executor-v2
      paths:
        - .cache/kaniko/
      policy: pull-push
  before_script:
    - apk add --no-cache bash crane git
    - export APP_VERSION="$(infra/scripts/current-version.sh)"
    - mkdir -p .cache/kaniko /kaniko/ssl/certs
    - test -s "$KANIKO_EXECUTOR" || crane export "$KANIKO_IMAGE" | tar -xOf - kaniko/executor > "$KANIKO_EXECUTOR"
    - chmod 0755 "$KANIKO_EXECUTOR"
    - cp /etc/ssl/certs/ca-certificates.crt /kaniko/ssl/certs/ca-certificates.crt
  script:
    - infra/scripts/ci-container-build.sh verify
  rules:
    - if: '$RELEASE_VERSION != ""'
      when: never
    - if: '$SONAR_SCAN_ONLY == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

01-e2e:
  stage: verify
  needs:
    - job: 01-build
      artifacts: true
    - job: 03-package
      artifacts: false
  image:
    name: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    entrypoint: [""]
  cache:
    - key: swirl-demo-app-playwright-npm-v2
      paths:
        - .cache/npm/
      policy: pull-push
  before_script:
    - cd swirlapp-web
    - npm ci
  script:
    - npm run test:e2e:ci
  artifacts:
    name: "swirl-demo-app-e2e-$CI_COMMIT_SHORT_SHA"
    expose_as: "Playwright E2E report"
    when: always
    expire_in: 7 days
    reports:
      junit: swirlapp-web/test-results/playwright-junit.xml
    paths:
      - swirlapp-web/test-results/
      - swirlapp-web/playwright-report/
  manual_confirmation: "Run the optional Playwright E2E tests for $CI_COMMIT_SHORT_SHA?"
  rules:
    - if: '$RELEASE_VERSION != ""'
      when: never
    - if: '$PLAYWRIGHT_SCHEDULE == "true" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")'
      allow_failure: false
    - if: '$SONAR_SCAN_ONLY == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true

04-coverage:
  stage: verify
  needs:
    - job: 02-test
      artifacts: true
  image: docker.io/library/maven@sha256:a697e2f303fca5675052a656daefab51d845c79e6121a26edbdf8e3e4832ed97
  before_script:
    - apk add --no-cache bash python3
  script:
    - infra/scripts/ci-verify.sh coverage
  coverage: '/TOTAL_COVERAGE=([0-9]+(?:\.[0-9]+)?)%/'
  allow_failure: true
  artifacts:
    name: "swirl-demo-app-coverage-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 7 days
    reports:
      junit:
        - coverage-policy-junit.xml
      dotenv: coverage-policy.env
    paths:
      - coverage-policy-junit.xml
      - coverage-policy.env
  rules:
    - if: '$RELEASE_VERSION != ""'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

02-quality:
  stage: verify
  needs:
    - job: 02-test
      artifacts: true
  image:
    name: node:26.13.1-bookworm-slim@sha256:5df79989ed685e09f0a98019db4cebfb22fb9df1a53c0161664a011f7ff6b0f1
    entrypoint: [""]
  cache:
    - key: swirl-demo-app-maven-v2
      paths:
        - .cache/maven/
      policy: pull
    - key: swirl-demo-app-sonar-v1
      paths:
        - .cache/sonar/cache/
      policy: pull-push
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git ca-certificates
    - export APP_VERSION="$("$CI_PROJECT_DIR/infra/scripts/current-version.sh")"
    - npm install --global @sonar/scan@5.0.2
  script:
    - bash infra/scripts/test-quality.sh
    - bash infra/scripts/ci-quality.sh
  allow_failure: true
  artifacts:
    name: "swirl-demo-app-quality-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 7 days
    reports:
      dotenv: quality-reports/quality.env
    paths:
      - quality-reports/
  rules:
    - if: '$RELEASE_VERSION != ""'
      when: never
    - if: '$PLAYWRIGHT_SCHEDULE == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$PIPELINE_MODE == "full" && $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$PIPELINE_MODE == "full" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true

03-security:
  stage: verify
  needs:
    - job: 00-delivery-policy
      artifacts: false
  image:
    name: docker.io/aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: .cache/trivy
    TRIVY_DISABLE_TELEMETRY: "true"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_TIMEOUT: 10m
  cache:
    - key: swirl-demo-app-trivy-v1
      paths:
        - .cache/trivy/
      policy: pull-push
  script:
    - mkdir -p security-reports
    - trivy fs --offline-scan --include-dev-deps --scanners vuln,misconfig,secret --skip-dirs '**/.git' --skip-dirs '**/.cache' --skip-dirs '**/node_modules' --skip-dirs '**/target' --skip-dirs '**/dist' --skip-dirs '**/coverage' --format json --output security-reports/trivy.json .
    - trivy convert --scanners vuln,misconfig,secret --format sarif --output security-reports/trivy.sarif security-reports/trivy.json
    # Inventory every Maven and npm dependency, including build-time ones, before the gate can stop the job.
    - trivy fs --offline-scan --include-dev-deps --format cyclonedx --skip-dirs '**/.git' --skip-dirs '**/.cache' --skip-dirs '**/node_modules' --skip-dirs '**/target' --skip-dirs '**/dist' --skip-dirs '**/coverage' --output security-reports/sbom.cdx.json .
    - trivy convert --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --format table --exit-code 1 security-reports/trivy.json
  allow_failure: true
  artifacts:
    name: "swirl-demo-app-security-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 7 days
    reports:
      cyclonedx:
        - security-reports/sbom.cdx.json
    paths:
      - security-reports/
  rules:
    - if: '$RELEASE_VERSION != ""'
      when: never
    - if: '$PLAYWRIGHT_SCHEDULE == "true"'
      when: never
    - if: '$SONAR_SCAN_ONLY == "true"'
      when: never
    - if: '$PIPELINE_MODE == "full" && $CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$PIPELINE_MODE == "full" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true

01-release:
  stage: release
  tags: [swirl-cloud-application-release]
  needs:
    - job: 01-build
      artifacts: true
    - job: 03-package
      artifacts: false
  image:
    name: docker.io/library/maven@sha256:a697e2f303fca5675052a656daefab51d845c79e6121a26edbdf8e3e4832ed97
    entrypoint: [""]
  cache:
    - key: swirl-demo-app-kaniko-executor-v2
      paths:
        - .cache/kaniko/
      policy: pull-push
  resource_group: swirl-demo-app-release
  interruptible: false
  before_script:
    - apk add --no-cache bash crane curl git jq
    - export APP_VERSION="$(infra/scripts/current-version.sh)"
    - mkdir -p .cache/kaniko /kaniko/ssl/certs
    - test -s "$KANIKO_EXECUTOR" || crane export "$KANIKO_IMAGE" | tar -xOf - kaniko/executor > "$KANIKO_EXECUTOR"
    - chmod 0755 "$KANIKO_EXECUTOR"
    - cp /etc/ssl/certs/ca-certificates.crt /kaniko/ssl/certs/ca-certificates.crt
  script:
    - infra/scripts/ci-release.sh publish
  artifacts:
    name: "swirl-demo-app-release-$CI_COMMIT_SHORT_SHA"
    expose_as: "Release packages and checksums"
    when: always
    expire_in: 7 days
    reports:
      dotenv: release.env
    paths:
      - package-output/
      - release.env
  manual_confirmation: "Release the successful Swirl Demo App build for $CI_COMMIT_SHORT_SHA?"
  rules:
    - if: '$RELEASE_VERSION != ""'
      when: never
    - if: '$PLAYWRIGHT_SCHEDULE == "true"'
      when: never
    - if: '$SONAR_SCAN_ONLY == "true"'
      when: never
    - if: '$NEW_MAJOR_VERSION != ""'
      when: never
    - if: '$DEPLOYMENT_ENVIRONMENT == "prod"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "api" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $APP_ONBOARDING == "true"'
    - if: '$DEPLOYMENT_ENVIRONMENT == "int"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PIPELINE_MODE == "full"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false

01-snapshot:
  stage: release
  needs:
    - job: 01-build
      artifacts: true
  image:
    name: docker.io/library/maven@sha256:a697e2f303fca5675052a656daefab51d845c79e6121a26edbdf8e3e4832ed97
    entrypoint: [""]
  cache:
    - key: swirl-demo-app-kaniko-executor-v2
      paths:
        - .cache/kaniko/
      policy: pull-push
  resource_group: swirl-demo-app-snapshot-$CI_PIPELINE_ID
  interruptible: false
  before_script:
    - apk add --no-cache bash crane curl git jq
    - mkdir -p .cache/kaniko /kaniko/ssl/certs
    - test -s "$KANIKO_EXECUTOR" || crane export "$KANIKO_IMAGE" | tar -xOf - kaniko/executor > "$KANIKO_EXECUTOR"
    - chmod 0755 "$KANIKO_EXECUTOR"
    - cp /etc/ssl/certs/ca-certificates.crt /kaniko/ssl/certs/ca-certificates.crt
  script:
    - infra/scripts/ci-release.sh snapshot
  artifacts:
    name: "swirl-demo-app-snapshot-$CI_COMMIT_SHORT_SHA"
    expose_as: "Immutable integration snapshot"
    when: always
    expire_in: 7 days
    reports:
      dotenv: release.env
    paths:
      - package-output/
      - release.env
  rules:
    - if: '$RELEASE_VERSION != "" || $SONAR_SCAN_ONLY == "true" || $PLAYWRIGHT_SCHEDULE == "true" || $APP_ONBOARDING == "true" || $DEPLOYMENT_ENVIRONMENT != "int" || $NEW_MAJOR_VERSION != ""'
      when: never
    - if: '$CI_COMMIT_BRANCH'

02-deploy:
  stage: release
  tags: ["swirl-cloud-application-$DEPLOYMENT_ENVIRONMENT"]
  needs:
    - job: 00-delivery-policy
      artifacts: false
    - job: 01-snapshot
      artifacts: true
      optional: true
    - job: 01-release
      artifacts: true
      optional: true
  image:
    name: docker.io/library/maven@sha256:a697e2f303fca5675052a656daefab51d845c79e6121a26edbdf8e3e4832ed97
    entrypoint: [""]
  resource_group: swirl-demo-app-$DEPLOYMENT_ENVIRONMENT
  interruptible: false
  before_script:
    - apk add --no-cache bash curl git jq python3 py3-yaml
    - curl --fail --silent --show-error --location --output /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.35.10/bin/linux/amd64/kubectl"
    - echo "c49a28f1f4efc4d475ed05f47f2ce8e563bf7bef69ed77fe1b924ea6d83b6327  /usr/local/bin/kubectl" | sha256sum -c
    - chmod 0755 /usr/local/bin/kubectl
  script:
    - infra/scripts/ci-release.sh deploy
  environment:
    name: $DEPLOYMENT_ENVIRONMENT
    url: $DEPLOYMENT_URL
    deployment_tier: $DEPLOYMENT_TIER
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      dotenv: release.env
    paths:
      - release.env
      - package-output/deployment.json
  rules:
    - if: '$SONAR_SCAN_ONLY == "true"'
      when: never
    - if: '$PLAYWRIGHT_SCHEDULE == "true"'
      when: never
    - if: '$NEW_MAJOR_VERSION != ""'
      when: never
    - if: '$CI_COMMIT_BRANCH && $DEPLOYMENT_ENVIRONMENT == "int"'
      variables:
        DEPLOYMENT_TIER: testing
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOYMENT_ENVIRONMENT == "uat"'
      variables:
        DEPLOYMENT_TIER: staging
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOYMENT_ENVIRONMENT == "prod"'
      variables:
        DEPLOYMENT_TIER: production

# Default-branch commits offer one manual publication; the release then deploys
# to uat automatically. prod promotes that uat release from a web pipeline.
01-publish:
  extends: 01-release
  manual_confirmation: "Publish $CI_COMMIT_SHORT_SHA as a release and deploy it to uat?"
  rules:
    - if: '$CI_PIPELINE_SOURCE != "push" || $RELEASE_VERSION != "" || $SONAR_SCAN_ONLY == "true" || $NEW_MAJOR_VERSION != ""'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

02-deploy-uat:
  extends: 02-deploy
  tags: [swirl-cloud-application-uat]
  needs:
    - job: 00-delivery-policy
      artifacts: false
    - job: 01-publish
      artifacts: true
  resource_group: swirl-demo-app-uat
  variables:
    DEPLOYMENT_ENVIRONMENT: uat
    DEPLOYMENT_TIER: staging
  rules:
    - if: '$CI_PIPELINE_SOURCE != "push" || $RELEASE_VERSION != "" || $SONAR_SCAN_ONLY == "true" || $NEW_MAJOR_VERSION != ""'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

set-major-version:
  stage: version
  tags: [swirl-cloud-application-release]
  image:
    name: docker.io/library/maven@sha256:a697e2f303fca5675052a656daefab51d845c79e6121a26edbdf8e3e4832ed97
    entrypoint: [""]
  needs:
    - job: 00-delivery-policy
      artifacts: false
  dependencies: []
  resource_group: swirl-demo-app-release
  interruptible: false
  before_script:
    - apk add --no-cache bash git jq
  script:
    - infra/scripts/ci-set-major-version.sh
  manual_confirmation: "Set the next Swirl Demo App major version from NEW_MAJOR_VERSION?"
  rules:
    - if: '$RELEASE_VERSION != ""'
      when: never
    - if: '$PLAYWRIGHT_SCHEDULE == "true"'
      when: never
    - if: '$SONAR_SCAN_ONLY == "true"'
      when: never
    - if: '$NEW_MAJOR_VERSION == ""'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
