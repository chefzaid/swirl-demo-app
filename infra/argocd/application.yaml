apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: swirl-demo-app
  namespace: infra
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: applications-unconfigured
  source:
    repoURL: http://gitlab.swirl.internal/swirl/swirl-demo-app.git
    targetRevision: main
    path: infra/k8s
  destination:
    name: select-environment-in-ci
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - PruneLast=true
    - FailOnSharedResource=true
