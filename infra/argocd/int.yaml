apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: swirl-demo-app-int
  namespace: infra
  annotations:
    swirl-demo-app.delivery/pipeline: '921'
    swirl-demo-app.delivery/source: 58c9963661b4126a8df57163d18f401242a7d848
    swirl-demo-app.delivery/kind: snapshot
  labels:
