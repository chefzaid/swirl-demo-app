apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: swirl-demo-app-int
  namespace: infra
  annotations:
    swirl-demo-app.delivery/pipeline: '900'
    swirl-demo-app.delivery/source: f2bf29f98b6337cb47f007e0a05055a309dc9ef1
    swirl-demo-app.delivery/kind: snapshot
  labels:
    app.kubernetes.io/name: swirl-demo-app
    app.kubernetes.io/part-of: swirl-demo-app
    swirl-cloud/environment: int
spec:
  project: applications-int
  source:
    repoURL: http://gitlab.swirlit.internal/swirlit/swirl-demo-app.git
    targetRevision: 2c669395ce57786305637125e375655cfaf9aca6
    path: infra/environments/int
  destination:
    name: in-cluster
    namespace: apps-int
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - PruneLast=true
    - FailOnSharedResource=true
