apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: swirl-demo-app-prod
  namespace: infra
  annotations:
    swirl-demo-app.delivery/pipeline: '1558'
    swirl-demo-app.delivery/source: e2ac2bc046590c5d7fabeba1ee55cf507df2062f
    swirl-demo-app.delivery/kind: release
  labels:
    app.kubernetes.io/name: swirl-demo-app
    app.kubernetes.io/part-of: swirl-demo-app
    swirl-cloud/environment: prod
spec:
  project: applications-prod
  source:
    repoURL: http://gitlab.swirlit.internal/swirlit/swirl-demo-app.git
    targetRevision: b152153c21892ce4689efaf92f71ec59016ee877
    path: infra/environments/prod
  destination:
    name: in-cluster
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - PruneLast=true
    - FailOnSharedResource=true
