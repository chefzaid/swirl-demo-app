apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: swirl-demo-app-prod
  namespace: infra
  annotations:
    swirl-demo-app.delivery/pipeline: '1934'
    swirl-demo-app.delivery/source: 7fb9bb35e3a4fa13fe81c0dc719a05e1af1f51e0
    swirl-demo-app.delivery/kind: release
  labels:
    app.kubernetes.io/name: swirl-demo-app
    app.kubernetes.io/part-of: swirl-demo-app
    swirl-cloud/environment: prod
spec:
  project: applications-prod
  source:
    repoURL: http://gitlab.swirl.internal/swirl/swirl-demo-app.git
    targetRevision: db1b274e955e5bbf07603970e3a195f121443d4a
    path: infra/environments/prod
  destination:
    name: in-cluster
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - PruneLast=true
    - FailOnSharedResource=true
