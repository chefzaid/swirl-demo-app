apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: swirl-demo-app-uat
  namespace: infra
  annotations:
    swirl-demo-app.delivery/pipeline: '1117'
    swirl-demo-app.delivery/source: 25ff1e0863d694ee21db5ddd104e5721922afab1
    swirl-demo-app.delivery/kind: release
  labels:
    app.kubernetes.io/name: swirl-demo-app
    app.kubernetes.io/part-of: swirl-demo-app
    swirl-cloud/environment: uat
spec:
  project: applications-uat
  source:
    repoURL: http://gitlab.swirlit.internal/swirlit/swirl-demo-app.git
    targetRevision: 4b57608acfb60dfb1baef65083ad19f80865edfd
    path: infra/environments/uat
  destination:
    name: in-cluster
    namespace: apps-uat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - PruneLast=true
    - FailOnSharedResource=true
