apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: swirl-demo-app-uat
  namespace: infra
  annotations:
    swirl-demo-app.delivery/pipeline: '1924'
    swirl-demo-app.delivery/source: 7fb9bb35e3a4fa13fe81c0dc719a05e1af1f51e0
    swirl-demo-app.delivery/kind: release
  labels:
    app.kubernetes.io/name: swirl-demo-app
    app.kubernetes.io/part-of: swirl-demo-app
    swirl-cloud/environment: uat
spec:
  project: applications-uat
  source:
    repoURL: http://gitlab.swirl.internal/swirl/swirl-demo-app.git
    targetRevision: 163134f59f42f47f871f28d70eff7f53622d3074
    path: infra/environments/uat
  destination:
