apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: swirl-demo-app-uat
  namespace: infra
  annotations:
    swirl-demo-app.delivery/pipeline: '1149'
    swirl-demo-app.delivery/source: e2ac2bc046590c5d7fabeba1ee55cf507df2062f
    swirl-demo-app.delivery/kind: release
  labels:
    app.kubernetes.io/name: swirl-demo-app
    app.kubernetes.io/part-of: swirl-demo-app
    swirl-cloud/environment: uat
spec:
  project: applications-uat
  source:
    repoURL: http://gitlab.swirlit.internal/swirlit/swirl-demo-app.git
    targetRevision: 473e9f925a92315b92c1f1adf23a690c3425af61
    path: infra/environments/uat
  destination:
    name: in-cluster
    namespace: apps-uat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
    - PruneLast=true
    - FailOnSharedResource=true
