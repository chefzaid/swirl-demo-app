- target:
    kind: ConfigMap
    name: swirl-demo-app-prometheus-rules
  patch: "- op: replace\n  path: /data\n  value:\n    swirl-demo-app-prod-slo-rules.yaml:\
    \ \"# Prometheus recording and alerting rules\\\n      \\ for the objectives in\
    \ docs/slo.md.\\n# Every selector names namespace=\\\"apps\\\"\\\n      ; render-deployment.py\
    \ rewrites it so\\n# each environment's copy covers only\\\n      \\ that environment's\
    \ namespace.\\n# Validate with: promtool check rules infra/observability/slo-rules.yaml\\\
    n\\\n      # Unit tests:    promtool test rules infra/observability/slo-rules.test.yaml\\\
    n\\\n      groups:\\n  - name: swirl-demo-app-sli\\n    rules:\\n      # Availability\
    \ SLI:\\\n      \\ share of API requests answered with a 5xx.\\n      - record:\
    \ swirl:api_error_ratio:rate5m\\n\\\n      \\        expr: |\\n          sum by\
    \ (namespace, app) (rate(http_server_requests_seconds_count{namespace=\\\"\\\n\
    \      apps\\\",app=~\\\"swirlapp-(user|order)\\\",uri!~\\\"/actuator.*\\\",status=~\\\
    \"5..\\\"}[5m]))\\n\\\n      \\          / sum by (namespace, app) (rate(http_server_requests_seconds_count{namespace=\\\
    \"\\\n      apps\\\",app=~\\\"swirlapp-(user|order)\\\",uri!~\\\"/actuator.*\\\
    \"}[5m]))\\n      - record:\\\n      \\ swirl:api_error_ratio:rate30m\\n     \
    \   expr: |\\n          sum by (namespace,\\\n      \\ app) (rate(http_server_requests_seconds_count{namespace=\\\
    \"apps\\\",app=~\\\"swirlapp-(user|order)\\\"\\\n      ,uri!~\\\"/actuator.*\\\
    \",status=~\\\"5..\\\"}[30m]))\\n          / sum by (namespace,\\\n      \\ app)\
    \ (rate(http_server_requests_seconds_count{namespace=\\\"apps\\\",app=~\\\"swirlapp-(user|order)\\\
    \"\\\n      ,uri!~\\\"/actuator.*\\\"}[30m]))\\n      - record: swirl:api_error_ratio:rate1h\\\
    n\\\n      \\        expr: |\\n          sum by (namespace, app) (rate(http_server_requests_seconds_count{namespace=\\\
    \"\\\n      apps\\\",app=~\\\"swirlapp-(user|order)\\\",uri!~\\\"/actuator.*\\\
    \",status=~\\\"5..\\\"}[1h]))\\n\\\n      \\          / sum by (namespace, app)\
    \ (rate(http_server_requests_seconds_count{namespace=\\\"\\\n      apps\\\",app=~\\\
    \"swirlapp-(user|order)\\\",uri!~\\\"/actuator.*\\\"}[1h]))\\n      - record:\\\
    \n      \\ swirl:api_error_ratio:rate6h\\n        expr: |\\n          sum by (namespace,\\\
    \n      \\ app) (rate(http_server_requests_seconds_count{namespace=\\\"apps\\\"\
    ,app=~\\\"swirlapp-(user|order)\\\"\\\n      ,uri!~\\\"/actuator.*\\\",status=~\\\
    \"5..\\\"}[6h]))\\n          / sum by (namespace,\\\n      \\ app) (rate(http_server_requests_seconds_count{namespace=\\\
    \"apps\\\",app=~\\\"swirlapp-(user|order)\\\"\\\n      ,uri!~\\\"/actuator.*\\\
    \"}[6h]))\\n      # Latency SLI: share of API requests slower\\\n      \\ than\
    \ 300 ms (the bucket the services publish).\\n      - record: swirl:api_slow_ratio:rate5m\\\
    n\\\n      \\        expr: |\\n          1 - sum by (namespace, app) (rate(http_server_requests_seconds_bucket{namespace=\\\
    \"\\\n      apps\\\",app=~\\\"swirlapp-(user|order)\\\",uri!~\\\"/actuator.*\\\
    \",le=\\\"0.3\\\"}[5m]))\\n\\\n      \\          / sum by (namespace, app) (rate(http_server_requests_seconds_count{namespace=\\\
    \"\\\n      apps\\\",app=~\\\"swirlapp-(user|order)\\\",uri!~\\\"/actuator.*\\\
    \"}[5m]))\\n      - record:\\\n      \\ swirl:api_slow_ratio:rate30m\\n      \
    \  expr: |\\n          1 - sum by (namespace,\\\n      \\ app) (rate(http_server_requests_seconds_bucket{namespace=\\\
    \"apps\\\",app=~\\\"\\\n      swirlapp-(user|order)\\\",uri!~\\\"/actuator.*\\\
    \",le=\\\"0.3\\\"}[30m]))\\n          /\\\n      \\ sum by (namespace, app) (rate(http_server_requests_seconds_count{namespace=\\\
    \"\\\n      apps\\\",app=~\\\"swirlapp-(user|order)\\\",uri!~\\\"/actuator.*\\\
    \"}[30m]))\\n      -\\\n      \\ record: swirl:api_slow_ratio:rate1h\\n      \
    \  expr: |\\n          1 - sum by\\\n      \\ (namespace, app) (rate(http_server_requests_seconds_bucket{namespace=\\\
    \"apps\\\"\\\n      ,app=~\\\"swirlapp-(user|order)\\\",uri!~\\\"/actuator.*\\\
    \",le=\\\"0.3\\\"}[1h]))\\n   \\\n      \\       / sum by (namespace, app) (rate(http_server_requests_seconds_count{namespace=\\\
    \"\\\n      apps\\\",app=~\\\"swirlapp-(user|order)\\\",uri!~\\\"/actuator.*\\\
    \"}[1h]))\\n      - record:\\\n      \\ swirl:api_slow_ratio:rate6h\\n       \
    \ expr: |\\n          1 - sum by (namespace,\\\n      \\ app) (rate(http_server_requests_seconds_bucket{namespace=\\\
    \"apps\\\",app=~\\\"\\\n      swirlapp-(user|order)\\\",uri!~\\\"/actuator.*\\\
    \",le=\\\"0.3\\\"}[6h]))\\n          /\\\n      \\ sum by (namespace, app) (rate(http_server_requests_seconds_count{namespace=\\\
    \"\\\n      apps\\\",app=~\\\"swirlapp-(user|order)\\\",uri!~\\\"/actuator.*\\\
    \"}[6h]))\\n\\n  - name:\\\n      \\ swirl-demo-app-alerts\\n    rules:\\n   \
    \   # Multi-window burn rates: 14.4x\\\n      \\ spends 2% of a 30-day budget\
    \ in an hour, 6x spends 5% in six hours.\\n    \\\n      \\  - alert: SwirlApiErrorBudgetFastBurn\\\
    n        expr: swirl:api_error_ratio:rate1h{namespace=\\\"\\\n      apps\\\"}\
    \ > 14.4 * 0.005 and swirl:api_error_ratio:rate5m{namespace=\\\"apps\\\"}\\\n\
    \      \\ > 14.4 * 0.005\\n        for: 2m\\n        labels:\\n          severity:\
    \ critical\\n\\\n      \\        annotations:\\n          summary: \\\"{{ $labels.app\
    \ }} in {{ $labels.namespace\\\n      \\ }} is burning its availability budget\
    \ fast\\\"\\n          description: \\\"{{\\\n      \\ $value | humanizePercentage\
    \ }} of API requests failed with 5xx over the last\\\n      \\ 5 minutes.\\\"\\\
    n          runbook: docs/slo.md#availability-alerts\\n      -\\\n      \\ alert:\
    \ SwirlApiErrorBudgetSlowBurn\\n        expr: swirl:api_error_ratio:rate6h{namespace=\\\
    \"\\\n      apps\\\"} > 6 * 0.005 and swirl:api_error_ratio:rate30m{namespace=\\\
    \"apps\\\"} >\\\n      \\ 6 * 0.005\\n        for: 15m\\n        labels:\\n  \
    \        severity: warning\\n\\\n      \\        annotations:\\n          summary:\
    \ \\\"{{ $labels.app }} in {{ $labels.namespace\\\n      \\ }} is steadily burning\
    \ its availability budget\\\"\\n          description: \\\"\\\n      {{ $value\
    \ | humanizePercentage }} of API requests failed with 5xx over the last\\\n  \
    \    \\ 30 minutes.\\\"\\n          runbook: docs/slo.md#availability-alerts\\\
    n      -\\\n      \\ alert: SwirlApiLatencyBudgetFastBurn\\n        expr: swirl:api_slow_ratio:rate1h{namespace=\\\
    \"\\\n      apps\\\"} > 14.4 * 0.05 and swirl:api_slow_ratio:rate5m{namespace=\\\
    \"apps\\\"} >\\\n      \\ 14.4 * 0.05\\n        for: 2m\\n        labels:\\n \
    \         severity: critical\\n\\\n      \\        annotations:\\n          summary:\
    \ \\\"{{ $labels.app }} in {{ $labels.namespace\\\n      \\ }} is burning its\
    \ latency budget fast\\\"\\n          description: \\\"{{ $value\\\n      \\ |\
    \ humanizePercentage }} of API requests took longer than 300 ms over the last\\\
    \n      \\ 5 minutes.\\\"\\n          runbook: docs/slo.md#latency-alerts\\n \
    \     - alert:\\\n      \\ SwirlApiLatencyBudgetSlowBurn\\n        expr: swirl:api_slow_ratio:rate6h{namespace=\\\
    \"\\\n      apps\\\"} > 6 * 0.05 and swirl:api_slow_ratio:rate30m{namespace=\\\
    \"apps\\\"} > 6\\\n      \\ * 0.05\\n        for: 15m\\n        labels:\\n   \
    \       severity: warning\\n \\\n      \\       annotations:\\n          summary:\
    \ \\\"{{ $labels.app }} in {{ $labels.namespace\\\n      \\ }} is steadily burning\
    \ its latency budget\\\"\\n          description: \\\"{{ $value\\\n      \\ |\
    \ humanizePercentage }} of API requests took longer than 300 ms over the last\\\
    \n      \\ 30 minutes.\\\"\\n          runbook: docs/slo.md#latency-alerts\\n\
    \      - alert:\\\n      \\ SwirlTargetDown\\n        expr: up{namespace=\\\"\
    apps\\\",app=~\\\"swirlapp-(user|order)\\\"\\\n      } == 0\\n        for: 5m\\\
    n        labels:\\n          severity: critical\\n   \\\n      \\     annotations:\\\
    n          summary: \\\"{{ $labels.app }} pod {{ $labels.pod\\\n      \\ }} in\
    \ {{ $labels.namespace }} cannot be scraped\\\"\\n          description:\\\n \
    \     \\ \\\"Prometheus has not scraped this target for 5 minutes.\\\"\\n    \
    \      runbook:\\\n      \\ docs/slo.md#saturation-and-target-alerts\\n      -\
    \ alert: SwirlDatabasePoolSaturated\\n\\\n      \\        expr: max by (namespace,\
    \ app) (hikaricp_connections_pending{namespace=\\\"\\\n      apps\\\",app=~\\\"\
    swirlapp-(user|order)\\\"}) > 0\\n        for: 5m\\n        labels:\\n\\\n   \
    \   \\          severity: warning\\n        annotations:\\n          summary:\
    \ \\\"{{\\\n      \\ $labels.app }} in {{ $labels.namespace }} is waiting for\
    \ database connections\\\"\\\n      \\n          description: \\\"{{ $value }}\
    \ requests have waited for a pooled connection\\\n      \\ for 5 minutes.\\\"\\\
    n          runbook: docs/slo.md#saturation-and-target-alerts\\n\\\n      \\  \
    \    - alert: SwirlHeapNearLimit\\n        expr: |\\n          max by (namespace,\\\
    \n      \\ app, pod) (\\n            sum by (namespace, app, pod) (jvm_memory_used_bytes{namespace=\\\
    \"\\\n      apps\\\",app=~\\\"swirlapp-(user|order)\\\",area=\\\"heap\\\"})\\\
    n            / sum by\\\n      \\ (namespace, app, pod) (jvm_memory_max_bytes{namespace=\\\
    \"apps\\\",app=~\\\"swirlapp-(user|order)\\\"\\\n      ,area=\\\"heap\\\"} > 0)\\\
    n          ) > 0.9\\n        for: 15m\\n        labels:\\n\\\n      \\       \
    \   severity: warning\\n        annotations:\\n          summary: \\\"{{\\\n \
    \     \\ $labels.app }} pod {{ $labels.pod }} has used over 90% of its heap for\
    \ 15\\\n      \\ minutes\\\"\\n          description: \\\"Heap use is {{ $value\
    \ | humanizePercentage\\\n      \\ }} of the maximum.\\\"\\n          runbook:\
    \ docs/slo.md#saturation-and-target-alerts\\n\\\n      \\      - alert: SwirlConsumerLagHigh\\\
    n        expr: max by (namespace, app,\\\n      \\ topic) (kafka_consumer_fetch_manager_records_lag_max{namespace=\\\
    \"apps\\\",app=~\\\"\\\n      swirlapp-(user|order)\\\"}) > 1000\\n        for:\
    \ 10m\\n        labels:\\n      \\\n      \\    severity: warning\\n        annotations:\\\
    n          summary: \\\"{{ $labels.app\\\n      \\ }} in {{ $labels.namespace\
    \ }} is more than 1000 records behind on {{ $labels.topic\\\n      \\ }}\\\"\\\
    n          description: \\\"The consumer has lagged for 10 minutes; events\\\n\
    \      \\ are processed late.\\\"\\n          runbook: docs/slo.md#event-backlog-alerts\\\
    n\\\n      \\      - alert: SwirlEventsDeadLettered\\n        expr: sum by (namespace,\
    \ app,\\\n      \\ topic) (increase(swirl_events_dead_lettered_total{namespace=\\\
    \"apps\\\",app=~\\\"\\\n      swirlapp-(user|order)\\\"}[15m])) > 0\\n       \
    \ labels:\\n          severity: warning\\n\\\n      \\        annotations:\\n\
    \          summary: \\\"{{ $labels.app }} in {{ $labels.namespace\\\n      \\\
    \ }} sent records from {{ $labels.topic }} to the dead-letter topic\\\"\\n   \
    \ \\\n      \\      description: \\\"{{ $value }} records exhausted their retries\
    \ in the last\\\n      \\ 15 minutes.\\\"\\n          runbook: docs/slo.md#event-backlog-alerts\\\
    n     \\\n      \\ - alert: SwirlOutboxBacklog\\n        expr: max by (namespace,\
    \ app) (swirl_outbox_pending{namespace=\\\"\\\n      apps\\\",app=\\\"swirlapp-order\\\
    \"}) > 100\\n        for: 10m\\n        labels:\\n \\\n      \\         severity:\
    \ warning\\n        annotations:\\n          summary: \\\"{{ $labels.app\\\n \
    \     \\ }} in {{ $labels.namespace }} has {{ $value }} order events waiting in\
    \ the\\\n      \\ outbox\\\"\\n          description: \\\"The outbox relay has\
    \ not caught up for\\\n      \\ 10 minutes; orders stay PENDING until their events\
    \ publish.\\\"\\n          runbook:\\\n      \\ docs/operations.md#order-events-are-waiting-in-the-outbox\\\
    n      - alert:\\\n      \\ SwirlCacheFailing\\n        expr: sum by (namespace,\
    \ app, cache) (rate(swirl_cache_errors_total{namespace=\\\"\\\n      apps\\\"\
    ,app=~\\\"swirlapp-(user|order)\\\"}[5m])) > 0\\n        for: 10m\\n       \\\n\
    \      \\ labels:\\n          severity: warning\\n        annotations:\\n    \
    \      summary:\\\n      \\ \\\"{{ $labels.app }} in {{ $labels.namespace }} has\
    \ been reading {{ $labels.cache\\\n      \\ }} without its cache for 10 minutes\\\
    \"\\n          description: \\\"Cache operations\\\n      \\ fail and fall through\
    \ to the database; check Redis.\\\"\\n          runbook:\\\n      \\ docs/slo.md#saturation-and-target-alerts\\\
    n\"\n"
