JWT_AUDIENCE=swirl-demo-app-prod-web
JWT_ISSUER_URI=https://keycloak.swirlit.dev/auth/realms/swirlit
JWT_JWK_SET_URI=http://keycloak.swirlit.internal:8080/auth/realms/swirlit/protocol/openid-connect/certs
CORS_ALLOWED_ORIGINS=https://demo.swirlit.dev
APP_RATE_LIMIT_TRUSTED_PROXY_CIDRS=10.42.0.0/16
APP_API_DOCS_ENABLED=true
