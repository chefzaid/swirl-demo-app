apiVersion: v1
kind: ConfigMap
metadata:
  name: swirl-demo-app-grafana-dashboard
  namespace: apps
  labels:
    grafana_dashboard: "1"
data:
  swirl-demo-app-overview.json: |
    {
      "uid": "swirl-demo-app-overview",
      "title": "Swirl Demo App Overview",
      "tags": ["swirl-demo-app", "spring-boot", "provisioned"],
      "timezone": "browser",
      "schemaVersion": 41,
      "version": 2,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "application",
            "label": "Application",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": {"query": "label_values(up{job=\"kubernetes-pods\",namespace=\"apps\"}, app)", "refId": "PrometheusVariableQueryEditor-VariableQuery"},
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 1,
            "current": {"text": "All", "value": ["$__all"]}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Application Targets Up",
          "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(up{job=\"kubernetes-pods\",namespace=\"apps\",app=~\"$application\"})", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "red"}, {"color": "green", "value": 1}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "none"}
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Request Rate",
          "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"apps\",app=~\"$application\",uri!~\"/actuator.*\"}[5m]))", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "area"}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "5xx Error Rate",
          "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"apps\",app=~\"$application\",status=~\"5..\"}[5m]))", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "reqps", "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "red", "value": 0.01}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "area"}
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Average Response Time",
          "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(rate(http_server_requests_seconds_sum{namespace=\"apps\",app=~\"$application\",uri!~\"/actuator.*\"}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{namespace=\"apps\",app=~\"$application\",uri!~\"/actuator.*\"}[5m])), 0.000001)", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "area"}
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "HTTP Requests by Application and Status",
          "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum by (app, status) (rate(http_server_requests_seconds_count{namespace=\"apps\",app=~\"$application\",uri!~\"/actuator.*\"}[5m]))", "legendFormat": "{{app}} HTTP {{status}}"}],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "JVM Heap Used",
          "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum by (app) (jvm_memory_used_bytes{namespace=\"apps\",app=~\"$application\",area=\"heap\"})", "legendFormat": "{{app}}"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Application CPU",
          "gridPos": {"x": 0, "y": 12, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum by (app) (process_cpu_usage{namespace=\"apps\",app=~\"$application\"}) * 100", "legendFormat": "{{app}}"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Database Connections",
          "gridPos": {"x": 8, "y": 12, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "expr": "sum by (app) (hikaricp_connections_active{namespace=\"apps\",app=~\"$application\"})", "legendFormat": "{{app}} active"},
            {"refId": "B", "expr": "sum by (app) (hikaricp_connections_pending{namespace=\"apps\",app=~\"$application\"})", "legendFormat": "{{app}} pending"}
          ],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Pod Memory",
          "gridPos": {"x": 16, "y": 12, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"apps\",container=~\"swirlapp-user|swirlapp-order|swirlapp-web\"})", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 10,
          "type": "table",
          "title": "Swirl Demo App Pod Restarts",
          "gridPos": {"x": 0, "y": 20, "w": 24, "h": 7},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "kube_pod_container_status_restarts_total{namespace=\"apps\"}", "legendFormat": "{{pod}} / {{container}}", "instant": true, "format": "table"}],
          "options": {"showHeader": true}
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "API 5xx Ratio (objective 0.5%)",
          "gridPos": {"x": 0, "y": 27, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum by (app) (rate(http_server_requests_seconds_count{namespace=\"apps\",app=~\"$application\",uri!~\"/actuator.*\",status=~\"5..\"}[5m])) / sum by (app) (rate(http_server_requests_seconds_count{namespace=\"apps\",app=~\"$application\",uri!~\"/actuator.*\"}[5m]))", "legendFormat": "{{app}}"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "custom": {"thresholdsStyle": {"mode": "line"}}, "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "red", "value": 0.005}]}}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "API Requests Slower Than 300 ms (objective 5%)",
          "gridPos": {"x": 8, "y": 27, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "1 - sum by (app) (rate(http_server_requests_seconds_bucket{namespace=\"apps\",app=~\"$application\",uri!~\"/actuator.*\",le=\"0.3\"}[5m])) / sum by (app) (rate(http_server_requests_seconds_count{namespace=\"apps\",app=~\"$application\",uri!~\"/actuator.*\"}[5m]))", "legendFormat": "{{app}}"}],
          "fieldConfig": {"defaults": {"unit": "percentunit", "custom": {"thresholdsStyle": {"mode": "line"}}, "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "red", "value": 0.05}]}}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Kafka Consumer Lag",
          "gridPos": {"x": 16, "y": 27, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "max by (app, topic) (kafka_consumer_fetch_manager_records_lag_max{namespace=\"apps\",app=~\"$application\"})", "legendFormat": "{{app}} {{topic}}"}],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Event Retries and Dead Letters (per 5 minutes)",
          "gridPos": {"x": 0, "y": 35, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum by (app, topic) (increase(swirl_events_failed_deliveries_total{namespace=\"apps\",app=~\"$application\"}[5m]))", "legendFormat": "failed {{app}} {{topic}}"}, {"refId": "B", "expr": "sum by (app, topic) (increase(swirl_events_dead_lettered_total{namespace=\"apps\",app=~\"$application\"}[5m]))", "legendFormat": "dead-lettered {{app}} {{topic}}"}],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Cache Hit Ratio",
          "gridPos": {"x": 8, "y": 35, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum by (app, cache) (rate(cache_gets_total{namespace=\"apps\",app=~\"$application\",result=\"hit\"}[5m])) / sum by (app, cache) (rate(cache_gets_total{namespace=\"apps\",app=~\"$application\"}[5m]))", "legendFormat": "{{app}} {{cache}}"}],
          "fieldConfig": {"defaults": {"unit": "percentunit"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Cache Errors and Rate-Limit Rejections",
          "gridPos": {"x": 16, "y": 35, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum by (app, cache) (rate(swirl_cache_errors_total{namespace=\"apps\",app=~\"$application\"}[5m]))", "legendFormat": "cache errors {{app}} {{cache}}"}, {"refId": "B", "expr": "sum by (app) (rate(swirl_rate_limit_rejections_total{namespace=\"apps\",app=~\"$application\"}[5m]))", "legendFormat": "429 {{app}}"}],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        }
      ]
    }
