apiVersion: apps/v1
kind: Deployment
metadata:
  name: swirlapp-order
  namespace: apps
  labels:
    app: swirlapp-order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swirlapp-order
  template:
    metadata:
      labels:
        app: swirlapp-order
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: swirl-demo-app-registry-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: swirlapp-order
        image: registry.swirlit.dev/swirlit/swirl-demo-app/swirlapp-order:v5
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8081
        envFrom:
        - configMapRef:
            name: swirl-demo-app-backend-config
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: swirl-demo-app-runtime-credentials
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: swirl-demo-app-runtime-credentials
              key: DB_PASSWORD
        - name: REDIS_USERNAME
          valueFrom:
            secretKeyRef:
              name: swirl-demo-app-runtime-credentials
              key: REDIS_USERNAME
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: swirl-demo-app-runtime-credentials
              key: REDIS_PASSWORD
        - name: KAFKA_USERNAME
          valueFrom:
            secretKeyRef:
              name: swirl-demo-app-runtime-credentials
              key: KAFKA_USERNAME
        - name: KAFKA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: swirl-demo-app-runtime-credentials
              key: KAFKA_PASSWORD
        - name: KAFKA_ENABLED
          value: "true"
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 24
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: "1"
            memory: 768Mi
        volumeMounts:
          - name: tmp
            mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: swirlapp-order
  annotations:
    traefik.ingress.kubernetes.io/service.serverstransport: apps-swirl-demo-app-backend@kubernetescrd
  namespace: apps
  labels:
    app: swirlapp-order
spec:
  selector:
    app: swirlapp-order
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: 8081
  type: ClusterIP
