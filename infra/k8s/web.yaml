apiVersion: apps/v1
kind: Deployment
metadata:
  name: swirlapp-web
  namespace: apps
  labels:
    app: swirlapp-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swirlapp-web
  template:
    metadata:
      labels:
        app: swirlapp-web
    spec:
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: swirl-demo-app-registry-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: swirlapp-web
        image: registry.swirlit.dev/swirlit/swirl-demo-app/swirlapp-web:v3
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /runtime-config.json
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
          - name: runtime-config
            mountPath: /usr/share/nginx/html/runtime-config.json
            subPath: runtime-config.json
            readOnly: true
          - name: tmp
            mountPath: /tmp
      volumes:
        - name: runtime-config
          configMap:
            name: swirlapp-web-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: swirlapp-web
  annotations:
    traefik.ingress.kubernetes.io/service.serverstransport: apps-swirl-demo-app-backend@kubernetescrd
  namespace: apps
  labels:
    app: swirlapp-web
spec:
  selector:
    app: swirlapp-web
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
