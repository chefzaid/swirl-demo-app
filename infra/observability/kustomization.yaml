apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
# The platform Prometheus is to load ConfigMaps labelled prometheus_rule: "1"
# (see TODO.md, Needs Input). render-deployment.py gives each environment a
# copy scoped to its own namespace, as it does for the Grafana dashboard. A
# fixed name lets a label watcher replace the file in place instead of racing
# the deletion of an old hashed ConfigMap.
configMapGenerator:
  - name: swirl-demo-app-prometheus-rules
    files:
      - swirl-demo-app-slo-rules.yaml=slo-rules.yaml
    options:
      disableNameSuffixHash: true
      labels:
        prometheus_rule: "1"
