apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources:
- ../../k8s
- analysis-template.yaml
- rollouts.yaml
# Argo Rollouts takes the Pods over from the Deployments (workloadRef) and scales
# each Deployment down as its Rollout becomes available. Dropping spec.replicas
# keeps Argo CD self-healing from scaling the Deployments back up.
patches:
- target:
    kind: Deployment
  patch: |-
    - op: remove
      path: /spec/replicas
