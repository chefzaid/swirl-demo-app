# The autoscalers own replica counts in this profile, so the overlay removes
# spec.replicas from the Deployments and Argo CD never resets a scaled workload.
# Requires the Kubernetes metrics API (metrics-server) on the target cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: swirlapp-user
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: swirlapp-user
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
