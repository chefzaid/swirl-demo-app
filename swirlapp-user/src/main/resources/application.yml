server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful
  compression:
    enabled: true

spring:
  application:
    name: swirlapp-user
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:h2:mem:userdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  h2:
    console:
      enabled: true
  flyway:
    enabled: false
  cache:
    type: simple
    cache-names: users
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: SCRAM-SHA-512
      sasl.jaas.config: >-
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:${KAFKA_TOPIC_PREFIX:}user-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Unreadable records surface in the listener's error handler and go to the dead-letter topic instead of
      # failing every poll and stopping the partition.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: dev.swirlit.demo.common.event
        spring.json.value.default.type: dev.swirlit.demo.common.event.OrderEvent
        # The payload alone defines the contract; a Java class name in a header would couple it to code layout.
        spring.json.use.type.headers: false
    producer:
      acks: all
      retries: 10
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        max.in.flight.requests.per.connection: 5
        # Fail a send within 5 s when the broker is unreachable instead of holding the request thread for 60 s.
        max.block.ms: 5000
    # Each observed send looks up the cluster ID until it first succeeds; bound that lookup while Kafka is down.
    admin:
      operation-timeout: 5s
      properties:
        default.api.timeout.ms: 5000
        request.timeout.ms: 5000
    # Observations time each publish (spring.kafka.template) and each handled record (spring.kafka.listener).
    template:
      observation-enabled: true
    listener:
      auto-startup: ${KAFKA_ENABLED:false}
      ack-mode: record
      observation-enabled: true

app:
  # Largest accepted request body; bigger ones get 413 before they are parsed.
  request-size:
    max: ${APP_REQUEST_SIZE_MAX:64KB}
  security:
    enabled: false
    roles:
      # Realm role needed to delete users; blank lets any authenticated caller delete.
      user-admin: ${APP_SECURITY_ROLES_USER_ADMIN:}
      # Realm role needed to list and replay dead letters; blank lets any authenticated caller.
      operator: ${APP_SECURITY_ROLES_OPERATOR:}
  messaging:
    enabled: ${KAFKA_ENABLED:false}
    # true takes pods out of service while Kafka is unreachable; false keeps accepting orders as PENDING.
    required: ${APP_MESSAGING_REQUIRED:false}
    topics:
      order: ${KAFKA_TOPIC_PREFIX:}order_topic
      result: ${KAFKA_TOPIC_PREFIX:}order_result_topic
    retry:
      interval: 1s
      max-attempts: 4
  rate-limit:
    enabled: false
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
    max-tracked-clients: 10000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        # deadletters is not routed by the ingress and needs a token (and the operator role, if set).
        include: health,info,metrics,prometheus,deadletters
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      # Optional messaging reports DEGRADED when Kafka is unreachable: still HTTP 200, so pods stay ready.
      status:
        order: down,out-of-service,degraded,up,unknown
        http-mapping:
          down: 503
          out-of-service: 503
          degraded: 200
      group:
        readiness:
          include: readinessState,messaging
  health:
    redis:
      enabled: false
  info:
    env:
      enabled: true
  metrics:
    distribution:
      # Fixed buckets let Prometheus count requests inside the latency objective (docs/slo.md).
      slo:
        "[http.server.requests]": 300ms,1s

info:
  app:
    name: ${spring.application.name}
    description: User profile and Kafka order-validation service
    version: 1.0.0
    java: ${java.version}

springdoc:
  api-docs:
    enabled: ${APP_API_DOCS_ENABLED:true}
    path: /api/users/openapi
  swagger-ui:
    enabled: ${APP_API_DOCS_ENABLED:true}
    path: /api/docs
    urls:
      - name: Users
        url: /api/users/openapi
      - name: Orders
        url: /api/orders/openapi

logging:
  level:
    dev.swirlit.demo: INFO
    org.springframework.security: WARN

---
spring:
  config:
    activate:
      on-profile: uat | prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:swirl_demo_app_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_users
    locations: classpath:db/migration
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
          jwk-set-uri: ${JWT_JWK_SET_URI}
          audiences: ${JWT_AUDIENCE:swirlapp-web}

app:
  security:
    enabled: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  messaging:
    enabled: true
  rate-limit:
    enabled: true

management:
  health:
    redis:
      enabled: true

# API documentation is off in deployed profiles unless the environment opts in.
springdoc:
  api-docs:
    enabled: ${APP_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${APP_API_DOCS_ENABLED:false}
