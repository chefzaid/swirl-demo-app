<div class="app-shell">
  <header class="app-header">
    <a class="brand" routerLink="/" aria-label="Swirl Demo App home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" role="img">
          <path d="M8 9.5 20 3l12 6.5v13L20 29 8 22.5z" />
          <path d="m14 26 6 3.2 6-3.2v6.5L20 36l-6-3.5z" />
          <circle cx="20" cy="16" r="4" />
        </svg>
      </span>
      <span class="brand-copy">
        <strong>DEV/APP</strong>
        <small>cluster lab</small>
      </span>
    </a>

    <div class="header-actions">
      @if (isLoggedIn$ | async) {
        <nav class="app-nav" aria-label="Primary navigation">
          <a routerLink="/users" routerLinkActive="active" class="nav-link">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" /></svg>
            <span>Users</span>
          </a>
          <a routerLink="/orders" routerLinkActive="active" class="nav-link">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16.5 9.4-9-5.2M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16ZM3.3 7 12 12l8.7-5M12 22V12" /></svg>
            <span>Orders</span>
          </a>
          @if (apiDocsEnabled) {
            <a href="/api/docs" target="_blank" rel="noopener" class="nav-link nav-docs">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h8" /></svg>
              <span>API</span>
            </a>
          }
        </nav>
        <button (click)="logout()" class="logout-button" type="button">
          <span>Sign out</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" /></svg>
        </button>
      } @else {
        <span class="system-status"><i></i> Platform online</span>
      }
    </div>
  </header>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <footer class="app-footer">
    <div class="footer-status"><span class="pulse-dot"></span> Live reference environment</div>
    <p>Angular 22 <b>·</b> Java 25 <b>·</b> Spring Boot 4 <b>·</b> Kubernetes</p>
    <span class="footer-note">Built to show the whole delivery path, without the noise.</span>
  </footer>

  <app-notification></app-notification>
</div>
